<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="A.T.L.A.S.">
<meta name="theme-color" content="#05070a">
<title>A.T.L.A.S.</title>
<style>
  :root { --fundo: #05070a; --texto: #e8edf2; --suave: #7d8a96; --luz: 120, 190, 255; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fundo); color: var(--texto);
               font-family: -apple-system, "SF Pro Display", BlinkMacSystemFont, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; padding: 24px 16px;
         padding-top: calc(24px + env(safe-area-inset-top)); padding-bottom: calc(24px + env(safe-area-inset-bottom)); text-align: center; }
  .circulo { width: 168px; height: 168px; border-radius: 50%; border: 0; cursor: pointer; background:
             radial-gradient(circle at 50% 45%, rgba(var(--luz), .55), rgba(var(--luz), .12) 60%, rgba(var(--luz), .04) 72%);
             box-shadow: 0 0 60px rgba(var(--luz), .25), inset 0 0 30px rgba(var(--luz), .35); transition: transform .12s ease; }
  .circulo.ouvindo { animation: pulsa 1.6s ease-in-out infinite; }
  .circulo.pensando { animation: pulsa .9s ease-in-out infinite; --luz: 200, 170, 255; }
  .circulo.falando { animation: pulsa .6s ease-in-out infinite; --luz: 160, 230, 255; }
  @keyframes pulsa { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
  .estado { font-size: 15px; color: var(--suave); min-height: 20px; letter-spacing: .02em; }
  .fala { font-size: 19px; line-height: 1.45; max-width: 520px; min-height: 56px; }
  .fala small { display: block; font-size: 13px; color: var(--suave); margin-bottom: 6px; }
  .nota { font-size: 12px; color: var(--suave); max-width: 440px; line-height: 1.5; }
  .abrir { display: block; width: fit-content; margin: 16px auto 0; padding: 11px 28px; border-radius: 14px; font-size: 15px; font-weight: 600;
           color: var(--texto); text-decoration: none; background: rgba(var(--luz), .22); border: 1px solid rgba(var(--luz), .35); }
  .config { display: none; flex-direction: column; gap: 12px; width: 100%; max-width: 440px; }
  .config input { width: 100%; padding: 14px 16px; border-radius: 14px; border: 1px solid rgba(255,255,255,.15); background: #0e1318;
                  color: var(--texto); font-size: 15px; }
  .config button { padding: 13px; border-radius: 14px; border: 0; background: rgba(var(--luz), .25); color: var(--texto); font-size: 15px; font-weight: 600; }
  body.sem-chave .config { display: flex; } body.sem-chave .circulo, body.sem-chave .estado, body.sem-chave .fala { display: none; }
</style>
</head>
<body>
  <div class="config">
    <div>Na Casa, escreva <b>link da siri</b> na caixa de comando, copie o link e cole aqui (só na primeira vez).</div>
    <input id="link" type="url" placeholder="Cole o seu link aqui" autocomplete="off">
    <button id="salvar" type="button">Salvar</button>
  </div>
  <button class="circulo" id="circulo" aria-label="Conversar"></button>
  <div class="estado" id="estado">Toque no círculo para começar</div>
  <div class="fala" id="fala"></div>
  <div class="nota" id="nota"></div>
<script>
  // A.T.L.A.S.: conversa contínua por voz com a Casa. No computador (Chrome) o próprio navegador reconhece a voz; no
  // iPhone (o Safari não deixa), a página grava, percebe quando a pessoa parou de falar e manda o áudio para a Carteira,
  // que transcreve (Whisper, na Groq) e responde pelo mesmo cérebro da Siri (Voz.js). Ao abrir, ele cumprimenta.
  const VOZ_URL = 'https:/' + '/script.google.com/macros/s/AKfycby_BLepVFo1I3dpCglAWf_1HNjwlLuhlvj2p8RDR5r5KOoR2tbLPlS6G-ECN8wEvW7uRA/exec';
  const debugVoz = new URLSearchParams(location.search).get('debugvoz') === '1';
  const $ = id => document.getElementById(id);
  const Reconhecimento = window.SpeechRecognition || window.webkitSpeechRecognition;
  const ehIphone = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const guardar = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) { /* sem guardar */ } };
  const ler = k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
  let chave = ler('atlas-k');
  let conversando = false, falando = false, nome = ler('atlas-nome'), falaId = 0, falaAtual = '', audioAtual = null;
  const FIM_CONVERSA = /\b(tchau|ate mais|ate logo|ate depois|pode parar|encerrar|desligar)\b/;
  const semAcento = x => String(x).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

  function estado(t, classe) { $('estado').textContent = t; $('circulo').className = 'circulo' + (classe ? ' ' + classe : ''); }
  function nota(t) { $('nota').textContent = t; }
  function mostrarFala(quem, t) { $('fala').innerHTML = '<small>' + quem + '</small>' + String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

  // ---------- a chave (do link da Siri) ----------
  function pedirChave() { document.body.classList.toggle('sem-chave', !chave); }
  $('salvar').addEventListener('click', () => {
    const t = $('link').value.trim();
    const m = /[?&]k=([^&#\s]+)/.exec(t);
    const k = m ? decodeURIComponent(m[1]) : (/^[A-Za-z0-9_-]{20,}$/.test(t) ? t : '');
    if (!k) { alert('Não achei a chave nesse link. Copie o link inteiro, do https até o &t='); return; }
    chave = k; guardar('atlas-k', k); pedirChave(); aquecer();
  });
  pedirChave();

  // ---------- falar ----------
  function textoComparavel(t) { return semAcento(t).replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim(); }
  function pareceEcoDoAtlas(t) {
    const ouvido = textoComparavel(t), dito = textoComparavel(falaAtual);
    if (!ouvido || !dito) return false;
    if (ouvido.length >= 8 && dito.includes(ouvido)) return true;
    const palavras = ouvido.split(' ').filter(p => p.length > 2);
    return palavras.length >= 3 && palavras.filter(p => dito.split(' ').includes(p)).length / palavras.length >= 0.8;
  }

  function interromperFala() {
    if (!falando) return false;
    falaId++; // invalida o onend da fala cortada para ele não reiniciar duas vezes
    falando = false;
    falaAtual = '';
    pararAudioNeural();
    if (window.speechSynthesis) speechSynthesis.cancel();
    if (!conversando || enviando) return true;
    if (Reconhecimento && !ehIphone) estado('Ouvindo…', 'ouvindo');
    else ouvirGravando();
    return true;
  }

  function pararAudioNeural() {
    if (!audioAtual) return;
    const a = audioAtual;
    audioAtual = null;
    a.onended = null; a.onerror = null;
    try { a.pause(); a.currentTime = 0; a.removeAttribute('src'); a.load(); } catch (e) { /* já encerrou */ }
  }

  function falar(texto, depois, audio, audioTipo) {
    const id = ++falaId;
    const fim = () => {
      if (id !== falaId) return;
      pararAudioNeural();
      falando = false; falaAtual = '';
      depois && depois();
    };
    if (!texto) { fim(); return; }
    falando = true;
    falaAtual = texto;
    soltarMicrofone(); // o iPhone corta o microfone quando o site fala: solta antes e pede de novo depois
    try { ctx && ctx.state === 'running' && ctx.suspend(); } catch (e) { /* segue */ } // o áudio da página pausa: a voz não falha
    pararAudioNeural();
    if (window.speechSynthesis) speechSynthesis.cancel();
    estado('Falando… toque para interromper', 'falando');
    const falarPeloNavegador = () => {
      if (id !== falaId) return;
      if (!window.speechSynthesis) { fim(); return; }
      speechSynthesis.cancel();
      const f = new SpeechSynthesisUtterance(texto);
      f.lang = 'pt-BR';
      f.rate = 1.08;
      const voz = vozPortugues();
      if (voz) f.voice = voz;
      f.onend = fim; f.onerror = fim;
      speechSynthesis.speak(f);
    };
    if (audio && window.Audio) {
      const a = new Audio('data:' + (audioTipo === 'audio/mpeg' ? audioTipo : 'audio/mpeg') + ';base64,' + audio);
      audioAtual = a;
      a.preload = 'auto';
      a.setAttribute('playsinline', '');
      a.onended = fim;
      a.onerror = () => { if (audioAtual === a) audioAtual = null; falarPeloNavegador(); };
      const tocando = a.play();
      if (tocando && tocando.catch) tocando.catch(() => { if (audioAtual === a) { pararAudioNeural(); falarPeloNavegador(); } });
      return;
    }
    falarPeloNavegador();
  }

  /** A voz em português: a "Melhorada" (ou Premium) quando foi baixada no aparelho; senão, a primeira pt-BR. */
  function vozPortugues() {
    // A mais natural que o aparelho tiver: as "Natural" do Edge (Francisca, Antônio), as Premium/Melhoradas do iPhone, a do Google
    const vozes = speechSynthesis.getVoices().filter(v => /^pt(-|_)BR/i.test(v.lang));
    const nota = v => (/natural|neural/i.test(v.name) ? 5 : /premium/i.test(v.name) ? 4 : /melhorad|aprimorad|enhanced/i.test(v.name) ? 3
      : /google/i.test(v.name) ? 2 : /luciana|felipe/i.test(v.name) ? 1 : 0);
    return vozes.sort((a, b) => nota(b) - nota(a))[0] || null;
  }
  if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();

  // ---------- a conversa: manda à Carteira o que ouviu (texto ou áudio) e fala a resposta ----------
  function despedir() {
    parar();
    falar(['Até mais', 'Até logo', 'Falou'][Math.floor(Math.random() * 3)] + (nome ? ', ' + nome : '') + '!', () => estado('Toque no círculo para começar'));
  }

  function pensar(corpo, depois) {
    enviando = true;
    estado('Pensando…', 'pensando');
    fetch(VOZ_URL, { method: 'POST', body: JSON.stringify(Object.assign({ app: 'atlas', k: chave, debugVoz: debugVoz ? 1 : 0 }, corpo)) })
      .then(r => r.json())
      .then(r => {
        enviando = false;
        if (r.nome) { nome = r.nome; guardar('atlas-nome', nome); }
        if (r.erro) {
          nota(r.erro);
          if (/chave/i.test(r.erro)) { chave = ''; guardar('atlas-k', null); pedirChave(); parar(); return; }
          depois && depois(); return;
        }
        nota(r.vozDiagnostico ? 'Diagnóstico da voz: ' + r.vozDiagnostico : '');
        if (r.texto) {
          mostrarFala('Você', r.texto);
          if (FIM_CONVERSA.test(semAcento(r.texto))) { despedir(); return; }
        }
        if (!r.fala) { depois && depois(); return; }
        $('fala').innerHTML += '<small style="margin-top:14px">Atlas</small>' + String(r.fala).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
        // "abre a carteira nos objetivos": um botão para abrir a Casa já na tela (o iPhone só abre outra página com um toque)
        if (r.abrir && /^https:\/\/script\.google\.com\//.test(r.abrir)) {
          const a = document.createElement('a');
          a.className = 'abrir'; a.href = r.abrir; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Abrir';
          $('fala').appendChild(a);
        }
        falar(r.fala, depois, r.audio, r.audioTipo);
      })
      .catch(e => { enviando = false; nota('Sem conexão com a Casa: ' + e.message); depois && depois(); });
  }

  // ---------- modo 1: o navegador reconhece (Chrome do computador) ----------
  let rec = null;
  function ouvirPeloNavegador() {
    rec = new Reconhecimento();
    rec.lang = 'pt-BR'; rec.interimResults = true; rec.continuous = true;
    rec.onresult = ev => {
      if (enviando) return;
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const t = ev.results[i][0].transcript.trim();
        if (falando && pareceEcoDoAtlas(t)) continue;
        if (falando && t) interromperFala();
        if (ev.results[i].isFinal && t) {
          if (FIM_CONVERSA.test(semAcento(t))) { mostrarFala('Você', t); despedir(); return; }
          pensar({ t }, () => conversando && estado('Ouvindo…', 'ouvindo'));
        }
        else mostrarFala('Você', t);
      }
    };
    rec.onerror = ev => {
      if (ev.error === 'no-speech' || ev.error === 'aborted') return;
      if (ev.error === 'service-not-allowed' || ev.error === 'not-allowed') { rec = null; nota('O navegador não deixou: vou gravar e transcrever.'); ouvirGravando(); return; }
      nota('Erro do reconhecimento: ' + ev.error);
    };
    rec.onend = () => { if (conversando && rec) try { rec.start(); } catch (e) { /* tenta no próximo toque */ } };
    rec.start();
    estado('Ouvindo…', 'ouvindo');
    nota('');
  }

  // ---------- modo 2: gravar e transcrever (iPhone) ----------
  let fluxo = null, fonte = null, ctx = null, analisador = null, gravador = null, pedacos = [], timer = null, modoGravacao = false;
  let falouAgora = false, ultimaVoz = 0, inicioGravacao = 0, ruido = 0.01, enviando = false, vozSeguida = 0;
  const VOZ_MINIMA_MS = 250; // barulho curto (porta, buzina) não conta como fala
  const SILENCIO_MS = 800, MAX_FALA_MS = 20000, REINICIO_MS = 12000;

  function tipoDoAudio() {
    const tipos = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'];
    return tipos.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
  }

  /** Solta o microfone (antes de falar): para a gravação sem enviar e desliga a captura. */
  function soltarMicrofone() {
    if (!modoGravacao) return;
    try { if (gravador && gravador.state !== 'inactive') { gravador.onstop = null; gravador.stop(); } } catch (e) { /* já parou */ }
    gravador = null;
    try { fonte && fonte.disconnect(); } catch (e) { /* já desligou */ }
    fonte = null;
    if (fluxo) fluxo.getTracks().forEach(tr => tr.stop());
    fluxo = null;
  }

  function diagnostico() {
    const tr = fluxo && fluxo.getAudioTracks()[0];
    return 'microfone: ' + (!tr ? 'desligado' : tr.muted ? 'mudo' : tr.readyState) + ' · áudio: ' + (ctx ? ctx.state : '—');
  }

  function comecarGravacao() {
    if (!conversando || falando || enviando) return;
    if (!fluxo) { ouvirGravando(); return; } // depois de falar: pede o microfone de novo
    pedacos = [];
    const tipo = tipoDoAudio();
    gravador = new MediaRecorder(fluxo, tipo ? { mimeType: tipo } : undefined);
    gravador.ondataavailable = ev => { if (ev.data && ev.data.size) pedacos.push(ev.data); };
    gravador.start();
    inicioGravacao = Date.now(); falouAgora = false; vozSeguida = 0;
    estado('Ouvindo…', 'ouvindo');
  }

  function pararGravacao(enviar) {
    if (!gravador || gravador.state === 'inactive') return;
    const g = gravador;
    g.onstop = () => {
      if (!enviar) { comecarGravacao(); return; }
      const blob = new Blob(pedacos, { type: g.mimeType || tipoDoAudio() || 'audio/mp4' });
      transcrever(blob);
    };
    g.stop();
  }

  function nivel() {
    const dados = new Uint8Array(analisador.fftSize);
    analisador.getByteTimeDomainData(dados);
    let soma = 0;
    for (let i = 0; i < dados.length; i++) { const v = (dados[i] - 128) / 128; soma += v * v; }
    return Math.sqrt(soma / dados.length);
  }

  function vigiar() {
    if (!conversando) return;
    if (gravador && gravador.state === 'recording' && !falando && !enviando) {
      const n = nivel(), agora = Date.now();
      const limiar = Math.max(0.025, ruido * 3.5);
      if (n > limiar) {
        vozSeguida += 60;
        if (vozSeguida >= VOZ_MINIMA_MS) falouAgora = true;
        if (falouAgora) ultimaVoz = agora;
      } else {
        vozSeguida = 0;
        if (!falouAgora) ruido = ruido * 0.95 + n * 0.05; // aprende o barulho do ambiente
      }
      if (falouAgora && (agora - ultimaVoz > SILENCIO_MS || agora - inicioGravacao > MAX_FALA_MS)) pararGravacao(true);
      else if (!falouAgora && agora - inicioGravacao > REINICIO_MS) pararGravacao(false); // só silêncio: recomeça
    }
  }

  function transcrever(blob) {
    enviando = true;
    estado('Pensando…', 'pensando');
    const leitor = new FileReader();
    leitor.onload = () => pensar({ audio: String(leitor.result).split(',')[1] || '', tipo: blob.type }, () => comecarGravacao());
    leitor.readAsDataURL(blob);
  }

  async function ouvirGravando() {
    modoGravacao = true;
    try {
      if (!fluxo) {
        fluxo = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
        const tr = fluxo.getAudioTracks()[0];
        if (tr) tr.onmute = () => nota('O iPhone deixou o microfone mudo. ' + diagnostico());
      }
      if (!ctx) { ctx = new (window.AudioContext || window.webkitAudioContext)(); analisador = ctx.createAnalyser(); analisador.fftSize = 1024; }
      if (!fonte) { fonte = ctx.createMediaStreamSource(fluxo); fonte.connect(analisador); }
      if (ctx.state !== 'running') { try { await ctx.resume(); } catch (e) { /* mostra no diagnóstico */ } }
      if (!conversando || falando) return;
      clearInterval(timer); timer = setInterval(vigiar, 60);
      comecarGravacao();
    } catch (e) {
      conversando = false;
      estado('Toque no círculo para começar');
      nota('Não abriu o microfone: ' + e.message + '. Confira Ajustes → Safari → Microfone.');
    }
  }

  // ---------- começar / parar ----------
  function parar() {
    conversando = false;
    clearInterval(timer);
    try { rec && rec.stop(); } catch (e) { /* já parou */ }
    rec = null;
    soltarMicrofone();
    estado('Toque no círculo para começar');
  }

  // Acorda o Apps Script antes do primeiro toque. Não chama a IA nem transcreve áudio.
  let aquecidoEm = 0;
  function aquecer() {
    if (!chave || Date.now() - aquecidoEm < 5 * 60 * 1000) return;
    aquecidoEm = Date.now();
    fetch(VOZ_URL, { method: 'POST', body: JSON.stringify({ app: 'atlas', k: chave, aquecer: true }) }).catch(() => {});
  }
  aquecer();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') aquecer(); });

  $('circulo').addEventListener('click', () => {
    if (falando) { interromperFala(); return; }
    if (conversando) { parar(); if (window.speechSynthesis) speechSynthesis.cancel(); return; }
    conversando = true;
    if (window.speechSynthesis) speechSynthesis.speak(new SpeechSynthesisUtterance('')); // libera a voz no toque (iPhone)
    $('fala').textContent = '';
    if (Reconhecimento && !ehIphone) ouvirPeloNavegador(); else ouvirGravando();
    pensar({ inicio: true }, () => (Reconhecimento && !ehIphone) ? estado('Ouvindo…', 'ouvindo') : comecarGravacao()); // a saudação
  });
</script>
</body>
</html>
