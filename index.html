<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="A.T.L.A.S.">
<meta name="theme-color" content="#05070a">
<title>A.T.L.A.S.</title>
<style>
  :root { --fundo: #05070a; --texto: #e8edf2; --suave: #7d8a96; --luz: 120, 190, 255; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fundo); color: var(--texto);
               font-family: -apple-system, "SF Pro Display", BlinkMacSystemFont, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 24px 16px;
         padding-top: calc(24px + env(safe-area-inset-top)); padding-bottom: calc(24px + env(safe-area-inset-bottom)); text-align: center; }
  .circulo { width: 168px; height: 168px; border-radius: 50%; border: 0; cursor: pointer; background:
             radial-gradient(circle at 50% 45%, rgba(var(--luz), .55), rgba(var(--luz), .12) 60%, rgba(var(--luz), .04) 72%);
             box-shadow: 0 0 60px rgba(var(--luz), .25), inset 0 0 30px rgba(var(--luz), .35); transition: transform .3s ease; }
  .circulo.ouvindo { animation: pulsa 1.4s ease-in-out infinite; }
  .circulo.falando { animation: pulsa .7s ease-in-out infinite; --luz: 160, 230, 255; }
  @keyframes pulsa { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  .estado { font-size: 15px; color: var(--suave); min-height: 20px; letter-spacing: .02em; }
  .fala { font-size: 19px; line-height: 1.45; max-width: 520px; min-height: 56px; }
  .fala small { display: block; font-size: 13px; color: var(--suave); margin-bottom: 6px; }
  .nota { font-size: 12px; color: var(--suave); max-width: 420px; line-height: 1.5; }
</style>
</head>
<body>
  <button class="circulo" id="circulo" aria-label="Conversar"></button>
  <div class="estado" id="estado">Toque no círculo para começar</div>
  <div class="fala" id="fala"></div>
  <div class="nota" id="nota">Teste 2: toque no círculo e fale. Diga "tchau" para parar.</div>
<script>
  // Teste 2 do reconhecimento de voz do Safari: o iPhone só abre o microfone no instante do toque. Então começa a ouvir
  // no próprio toque e fica ouvindo (continuous); enquanto fala, ignora o que ouvir. Se a escuta cair, tenta voltar sozinha
  // e, se o iPhone não deixar, pede um toque. Mostra em que passo deu erro.
  const $ = id => document.getElementById(id);
  const Reconhecimento = window.SpeechRecognition || window.webkitSpeechRecognition;
  let r = null, conversando = false, falando = false, voltas = 0;

  function estado(t, classe) {
    $('estado').textContent = t;
    $('circulo').className = 'circulo' + (classe ? ' ' + classe : '');
  }
  function nota(t) { $('nota').textContent = t; }

  function falar(texto, depois) {
    if (!window.speechSynthesis) { depois && depois(); return; }
    falando = true;
    speechSynthesis.cancel();
    const f = new SpeechSynthesisUtterance(texto);
    f.lang = 'pt-BR';
    const voz = speechSynthesis.getVoices().find(v => /^pt(-|_)BR/i.test(v.lang));
    if (voz) f.voice = voz;
    const fim = () => { falando = false; if (conversando) estado('Ouvindo…', 'ouvindo'); depois && depois(); };
    f.onend = fim; f.onerror = fim;
    estado('Falando…', 'falando');
    speechSynthesis.speak(f);
  }

  function responder(texto) {
    if (/\b(tchau|valeu|obrigado|pode parar)\b/i.test(texto)) {
      parar();
      falar('Até mais!', () => estado('Toque no círculo para começar'));
      return;
    }
    falar('Você disse: ' + texto);
  }

  function comecar(passo) {
    r = new Reconhecimento();
    r.lang = 'pt-BR';
    r.interimResults = true;
    r.continuous = true;
    r.onresult = ev => {
      if (falando) return; // o que ele mesmo fala não conta
      let parcial = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const t = ev.results[i][0].transcript.trim();
        if (ev.results[i].isFinal) { $('fala').innerHTML = '<small>Você</small>' + t; if (t) responder(t); }
        else parcial += t;
      }
      if (parcial) $('fala').innerHTML = '<small>Você</small>' + parcial;
    };
    r.onerror = ev => {
      if (ev.error === 'no-speech' || ev.error === 'aborted') return;
      nota(`Erro no passo "${passo}": ${ev.error}` + (ev.error === 'service-not-allowed' || ev.error === 'not-allowed'
        ? '. Confira Ajustes → Geral → Teclado → Ditado (ligado) e Ajustes → Safari → Microfone (Permitir).' : ''));
      if (passo !== 'toque') conversando = false;
    };
    r.onend = () => {
      if (!conversando) return;
      voltas++;
      try { comecar('voltar sozinho ' + voltas); r.start(); }
      catch (e) { conversando = false; estado('Toque no círculo para continuar'); nota('Voltar sozinho não deu: ' + e.message); }
    };
    r.start();
  }

  function parar() {
    conversando = false;
    try { r && r.stop(); } catch (e) { /* já parou */ }
  }

  $('circulo').addEventListener('click', () => {
    if (!Reconhecimento) { estado('Este navegador não tem reconhecimento de voz'); nota('Abra pelo Safari do iPhone.'); return; }
    if (conversando) { parar(); speechSynthesis.cancel(); estado('Toque no círculo para começar'); return; }
    conversando = true;
    voltas = 0;
    const modo = window.navigator.standalone ? 'app da tela de início' : 'navegador';
    nota(`Teste 2 (${modo}): fale algo e eu repito. Diga "tchau" para parar.`);
    try { comecar('toque'); estado('Ouvindo…', 'ouvindo'); }
    catch (e) { conversando = false; nota('Não abriu o microfone: ' + e.message); }
  });
</script>
</body>
</html>
